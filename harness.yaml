# SHARP Configuration
# System for Harnessing Augmented Reasoning and Transforming Heuristics

llm:
  provider: openai
  model: gpt-4o
  api_key: "${OPENROUTER_API_KEY}"  # Set via environment variable
  api_base: "https://openrouter.ai/api/v1"
  temperature: 0.7
  max_tokens: 2048
  timeout: 60.0

context:
  total_token_budget: 8000
  compression_threshold: 0.8
  dedup_threshold: 0.85
  layers:
    - name: opencode_session
      source: opencode_context
      source_type: callable
      priority: 0
      disclosure_level: index
      keywords: [opencode, code, edit, file, search]
    - name: project_memory
      source: .harness/memory.md
      source_type: file
      priority: 1
      disclosure_level: detail

prompt:
  system_prompt_template: default
  include_tools_in_prompt: true
  include_memory_in_prompt: true
  max_context_tokens: 6000
  reserved_output_tokens: 2000

tools:
  max_output_tokens: 2000
  blocked_tools:
    - rm -rf
    - sudo rm
    - mkfs
    - dd if=
    - format
  require_approval_for:
    - execute
    - critical

validation:
  enabled: true
  level: strict
  llm_judge_enabled: true
  llm_judge_model: gpt-4o-mini
  min_score: 0.7
  max_retries: 3
  rules: []

safety:
  circuit_breaker_enabled: true
  failure_threshold: 5
  recovery_seconds: 60.0
  budget_enabled: true
  max_cost_usd: 10.0
  max_tokens: 100000
  blocked_commands:
    - rm -rf
    - sudo
    - mkfs
    - dd if=
  approval_mode: risky_only

state:
  enabled: true
  backend: file
  checkpoint_dir: .harness/checkpoints
  session_ttl: 3600

observability:
  tracing_enabled: true
  metrics_enabled: true
  logging_level: INFO
  otlp_endpoint: null
  log_file: null

execution:
  loop_strategy: react
  max_iterations: 10
  timeout: 120.0

mcp:
  enabled: true
  auto_discover: true
  servers: []
