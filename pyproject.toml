[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sharp"
version = "0.1.0"
description = "SHARP - System for Harnessing Augmented Reasoning and Transforming Heuristics. A production-grade harness for LLM agents with context engineering, prompt engineering, validation, and MCP integration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "SHARP Contributors" }]
keywords = ["llm", "agent", "harness", "context-engineering", "prompt-engineering", "validation", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "litellm>=1.40.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "aiofiles>=24.0",
    "httpx>=0.27.0",
    "mcp>=1.20,<2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]
redis = [
    "redis>=5.0",
]

[project.scripts]
sharp = "sharp.cli:app"

[project.urls]
Homepage = "https://github.com/sharp-system/sharp"

[tool.hatch.build.targets.wheel]
packages = ["sharp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
