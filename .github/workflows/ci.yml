name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff critical checks (blocking)
        run: ruff check sharp/ tests/ --select E9,F63,F7,F82

      - name: Ruff full check (advisory)
        continue-on-error: true
        run: ruff check sharp/ tests/

      - name: Ruff format check (advisory)
        continue-on-error: true
        run: ruff format --check sharp/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - run: pytest tests/ -m "not llm_integration" --cov=sharp --cov-report=xml --cov-report=term-missing -q

      - name: Coverage gate
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; print(float(ET.parse('coverage.xml').getroot().attrib['line-rate']))")
          echo "Coverage: $COVERAGE"
          python -c "coverage=float('$COVERAGE'); assert coverage >= 0.70, f'Coverage {coverage:.1%} < 70%'"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - run: pytest tests/test_llm_integration.py -v -m llm_integration
        env:
          SHARP_LLM_TOKEN: ${{ secrets.SHARP_LLM_TOKEN }}
